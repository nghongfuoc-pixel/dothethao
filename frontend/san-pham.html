<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sản phẩm — Hồng Phước</title>
<meta name="description" content="Xem toàn bộ sản phẩm thể thao tại Hồng Phước: áo thể thao, đồ bộ, đồ bơi, áo ba lỗ, quần thể thao với giá ưu đãi.">
<meta property="og:type" content="website">
<meta property="og:title" content="Sản phẩm — Hồng Phước">
<meta property="og:description" content="Áo thể thao, đồ bộ, đồ bơi, áo ba lỗ, quần thể thao với giá ưu đãi.">
<meta property="og:image" content="assets/products/sp2.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">

<div id="header"></div>

<div class="page">
  <h1 class="page-title">Toàn bộ sản phẩm</h1>
  <p class="page-subtitle" id="product-count"></p>
  <div class="form-group" style="max-width:360px;">
    <input type="text" id="search-input" placeholder="Tìm sản phẩm theo tên...">
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</div>

<div id="footer"></div>

<script src="js/app.js"></script>
<script>
  renderHeader("san-pham.html");
  renderFooter();

  let activeCategory = "all";
  let searchTerm = "";

  function normalize(str) {
    return str
      .normalize("NFD")
      .replace(/[̀-ͯ]/g, "")
      .replace(/đ/g, "d")
      .replace(/Đ/g, "D")
      .toLowerCase();
  }

  function cardHtml(p) {
    const stock = p.stock ?? 100;
    const outOfStock = stock <= 0;
    return `
      <article class="card">
        <a href="san-pham-chi-tiet.html?id=${p.id}"><div class="card-img"><img src="${p.image}" alt="${p.name}" loading="lazy"></div></a>
        <div class="card-body">
          <span class="tag">${p.category.toUpperCase()}</span>
          <h3 class="card-name"><a href="san-pham-chi-tiet.html?id=${p.id}">${p.name}</a></h3>
          <div class="price">${formatVND(p.price)}</div>
          ${outOfStock ? '<div style="color:var(--red); font-size:0.8rem; font-weight:600;">Hết hàng</div>' : ""}
          <button class="btn btn-primary btn-block btn-sm" ${outOfStock ? "disabled" : ""}
            onclick="addToCart(${p.id}, 1, ${stock})">${outOfStock ? "Hết hàng" : "Thêm vào giỏ hàng"}</button>
        </div>
      </article>
    `;
  }

  function render(products) {
    let filtered = activeCategory === "all"
      ? products
      : products.filter((p) => p.categorySlug === activeCategory);

    if (searchTerm.trim()) {
      const needle = normalize(searchTerm.trim());
      filtered = filtered.filter((p) => normalize(p.name).includes(needle));
    }

    document.getElementById("grid").innerHTML = filtered.length
      ? filtered.map(cardHtml).join("")
      : `<p style="color:var(--muted)">Không tìm thấy sản phẩm phù hợp.</p>`;
    document.getElementById("product-count").textContent = `${filtered.length} sản phẩm`;
  }

  loadProducts().then((products) => {
    const cats = [{ slug: "all", name: "Tất cả" }];
    const seen = new Set();
    products.forEach((p) => {
      if (!seen.has(p.categorySlug)) {
        seen.add(p.categorySlug);
        cats.push({ slug: p.categorySlug, name: p.category });
      }
    });

    document.getElementById("filters").innerHTML = cats
      .map((c) => `<button data-slug="${c.slug}" class="${c.slug === "all" ? "active" : ""}">${c.name.toUpperCase()}</button>`)
      .join("");

    document.querySelectorAll("#filters button").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.slug;
        document.querySelectorAll("#filters button").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        render(products);
      });
    });

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchTerm = e.target.value;
      render(products);
    });

    render(products);
  });
</script>
